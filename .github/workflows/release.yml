name: OpsSwift release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/netd/go.mod
          cache-dependency-path: |
            sidecar/netd/go.sum
            sidecar/addyd/go.sum
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libcap-ng-dev pkg-config
      - name: Check macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          if ! command -v autoreconf || ! command -v glibtoolize; then
            brew install autoconf automake libtool
          fi
      - run: npm ci
      - name: Verify native architecture
        shell: bash
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
      - name: Build pinned engines
        shell: bash
        run: |
          target="${{ matrix.target }}"
          npm run build:sidecar -- "$target"
          npm run build:addyd -- "$target"
          npm run build:frpc -- "$target"
          if [ "$RUNNER_OS" = Windows ]; then
            npm run fetch:wintun
          else
            npm run build:openvpn
          fi
          node scripts/verify-bin-manifest.mjs
      - run: npx vitest run tests/localPtySmoke.test.ts
      - name: Build reviewed ARM64 package
        if: runner.os == 'macOS'
        run: python3 scripts/opsswift-package.py
      - name: Build desktop installers
        if: runner.os != 'macOS'
        shell: bash
        run: |
          npm run build
          npx electron-builder --x64 --publish never
          node scripts/verify-local-pty-pack.mjs release
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/verify-bin-manifest.mjs release/win-unpacked/resources/bin
            test -f release/OpsSwift-*-setup.exe
            test -f release/OpsSwift-*-portable.exe
          else
            node scripts/verify-bin-manifest.mjs release/linux-unpacked/resources/bin
            test -f release/OpsSwift-*.AppImage
            test -f release/OpsSwift-*.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpsSwift-${{ matrix.target }}-candidate
          path: |
            release/OpsSwift-*-mac-arm64.zip
            release/OpsSwift-*.AppImage
            release/OpsSwift-*.deb
            release/OpsSwift-*-setup.exe
            release/OpsSwift-*-portable.exe
            release/artifact.json
            .openvpn-src/*-source.tar.gz
          if-no-files-found: error
          retention-days: 14
# Publication is deliberately separate: a maintainer must review the actual native package,
# encrypted-profile compatibility and authorized device acceptance before creating a release.
