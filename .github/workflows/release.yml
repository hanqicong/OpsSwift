name: OpsSwift release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/netd/go.mod
      - run: npm ci
      - name: Verify native architecture
        run: test "$(uname -m)" = arm64
      - run: npm run typecheck
      - run: npm run lint
      - name: Build pinned engines
        run: npm run build:sidecar && npm run build:addyd && npm run build:frpc && npm run build:openvpn
      - run: npm test
      - name: Build reviewed ARM64 package
        run: python3 scripts/opsswift-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpsSwift-macos-arm64-candidate
          path: |
            release/OpsSwift-*-mac-arm64.zip
            release/artifact.json
            .openvpn-src/*-source.tar.gz
          retention-days: 14
# Publication is deliberately separate: a maintainer must review the actual native package,
# encrypted-profile compatibility and authorized device acceptance before creating a release.
